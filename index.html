<!doctype html>
<html lang="en" class="h-full bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Prevent third-party browser extension injection errors (e.g. MetaMask / Web3) from polluting the applet
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var src = (e && e.filename) || '';
          if (
            msg.indexOf('MetaMask') !== -1 ||
            msg.indexOf('ethereum') !== -1 ||
            msg.indexOf('evm') !== -1 ||
            src.indexOf('extension') !== -1 ||
            src.indexOf('inpage') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
          if (
            reason.indexOf('MetaMask') !== -1 ||
            reason.indexOf('ethereum') !== -1 ||
            reason.indexOf('evm') !== -1 ||
            reason.indexOf('extension') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.join(' ');
          if (str.indexOf('MetaMask') !== -1 || str.indexOf('ethereum') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvoicePro - Professional Invoicing & SaaS Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="description" content="Professional SaaS invoicing, estimate conversion, client tracking, and financial reporting suite." />
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased selection:bg-blue-600/20 selection:text-blue-900">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
